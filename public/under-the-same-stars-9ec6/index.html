<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
    <title></title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="app.js?v=3" defer></script>
</head>
<body>
  <a class="skip" href="#letter" hidden>跳到正文</a>
  <header class="topbar"><div class="top-actions"><button id="motion" aria-pressed="false" hidden>暂停文字动画</button><button id="contents" hidden>目录</button><button id="close" hidden>退出</button></div></header>
  <main>
    <section class="gate" id="gate" aria-label="输入密码">
      <form id="unlock" autocomplete="off"><label for="password">密码</label><div class="password-wrap"><input id="password" name="password" type="password" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="error"><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="primary unlock-button" type="submit"><span>进入</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></button><p id="error" role="status" aria-live="polite"></p></form>
      <noscript><p>需要开启 JavaScript 才能输入密码。</p></noscript>
    </section>
    <div id="opened" hidden>
      <h1 id="letter-title" class="sr-only" tabindex="-1">全文</h1>
      <article id="letter" aria-label="全文" tabindex="-1"></article>
      <footer class="ending"><p>Ray</p><button id="restart">回到开头</button></footer>
    </div>
  </main>
  <div id="focus-view" class="focus-view" role="region" aria-label="当前句子" tabindex="-1" hidden><div class="focus-text"><p id="focus-line" aria-live="polite" aria-atomic="true"></p></div></div>
  <div id="dock" class="dock" hidden role="region" aria-label="阅读与声音控制"><div class="reading-status sr-only"><span id="chapter-status">尚未开始</span><span id="read-progress">0%</span></div><div class="dock-controls"><button id="play" aria-label="开始逐句播放" aria-pressed="false"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>播放</span></button><button id="music" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4Z"/><path d="M17 8c3 2 3 6 0 8"/></svg><span>声音关闭</span></button><button id="mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h11"/></svg><span>全文</span></button><button id="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>设置</span></button></div><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-top"><h2 id="settings-title">阅读设置</h2><button data-dismiss aria-label="关闭阅读设置">×</button></div><label for="pace">播放速度</label><select id="pace"><option value="1">正常</option><option value="1.4">慢</option><option value="0.72">快</option></select><label for="volume">音量 <span id="volume-value">15%</span></label><input type="range" id="volume" min="0" max="100" value="15"><label class="check-label"><input type="checkbox" id="animation-setting" checked>文字淡入</label><p>滚动时会退出逐句播放，继续阅读全文。</p></dialog>
  <dialog id="contents-dialog" aria-labelledby="contents-title"><div class="dialog-top"><h2 id="contents-title">目录</h2><button data-dismiss aria-label="关闭目录">×</button></div><nav id="chapter-links" aria-label="章节目录"></nav></dialog>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <audio id="soundtrack" preload="none" loop src="same-sky.mp3?v=3"></audio>
</body>
</html>
