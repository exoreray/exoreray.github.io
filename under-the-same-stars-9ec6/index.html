<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d20">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="一封藏在星光里的信。">
  <title>一封星光里的信</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#letter" hidden>跳到正文</a>
  <div class="sky" aria-hidden="true"><div class="nebula nebula-a"></div><div class="nebula nebula-b"></div><div class="nebula nebula-c"></div><canvas id="stars"></canvas><div class="grain"></div></div>
  <header class="topbar"><span class="wordmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1c0 8 3 11 11 11-8 0-11 3-11 11C12 15 9 12 1 12 9 12 12 9 12 1Z"/></svg>一封星光里的信</span><div class="top-actions"><button id="motion" aria-pressed="false" title="暂停星空动画">静止星空</button><button id="contents" hidden>目录</button><button id="close" hidden>合上信</button></div></header>
  <main>
    <section class="gate" id="gate" aria-labelledby="gate-title">
      <div class="celestial" aria-hidden="true"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="moon"></div><span class="orbital-star"></span><span class="orbital-star second"></span></div>
      <div class="gate-copy"><p class="invitation">留了一片星空，给你。</p><h1 id="gate-title">有些话，<br>想在星光里说。</h1><p class="gate-sub">关于你，关于我，<br>关于我们可以一起创造的世界。</p></div>
      <form id="unlock" autocomplete="off"><label for="password">用我们的暗号，打开这封信</label><div class="password-wrap"><input id="password" name="password" type="password" required autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="error" placeholder="输入暗号"><button id="show-password" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="primary unlock-button" type="submit"><span>打开这封信</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button><p id="error" role="status" aria-live="polite"></p></form>
      <p class="gate-foot">不必着急。这里的时间，可以慢一点。</p>
      <noscript><p>请开启 JavaScript，以使用暗号打开这封信。</p></noscript>
    </section>
    <div id="opened" hidden>
      <section class="hero" aria-labelledby="letter-title"><div class="hero-orbit" aria-hidden="true"><span></span><span></span></div><p class="invitation">写给正在走近彼此的我们</p><h1 id="letter-title" tabindex="-1">属于我们的<br><span>宇宙</span></h1><p class="hero-quote">慢慢相处，也可以认真投入。</p><button id="begin" class="primary">让这封信，慢慢展开 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button><p class="hero-note">戴上耳机，或者就这样安静地读。<br>随时可以停下来，也可以自由滚动。</p><a class="scroll-cue" href="#letter" aria-label="滚动到信的正文"><span></span></a></section>
      <article id="letter" aria-label="信的全文"></article>
      <footer class="ending"><div class="end-stars" aria-hidden="true">✧</div><p>故事还在继续。</p><p class="signature">Ray</p><button id="restart">再读一次</button></footer>
    </div>
  </main>
  <div id="dock" class="dock" hidden role="region" aria-label="阅读与音乐控制"><div class="reading-status"><span class="status-star" aria-hidden="true">✧</span><span id="chapter-status">星光前奏</span><span id="read-progress">0%</span></div><div class="dock-controls"><button id="play" aria-label="开始逐句播放" aria-pressed="false"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg><span>慢慢播放</span></button><button id="music" aria-pressed="false"><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>音乐关闭</span></button><button id="mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c4-1 7 0 9 2 2-2 5-3 9-2v14c-4-1-7 0-9 2-2-2-5-3-9-2Z"/><path d="M12 7v14"/></svg><span>自由阅读</span></button><button id="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>阅读设置</span></button></div><div class="progress-track" aria-hidden="true"><span id="progress-fill"></span></div></div>
  <dialog id="settings-dialog" aria-labelledby="settings-title"><div class="dialog-top"><h2 id="settings-title">按你的节奏</h2><button data-dismiss aria-label="关闭阅读设置">×</button></div><label for="pace">逐句播放的速度</label><select id="pace"><option value="1">舒适</option><option value="1.4">更慢一些</option><option value="0.72">稍快一些</option></select><label for="volume">音乐音量 <span id="volume-value">35%</span></label><input type="range" id="volume" min="0" max="100" value="35"><label class="check-label"><input type="checkbox" id="animation-setting" checked>星空与文字动画</label><p>音乐：原创钢琴与氛围和声《同一片星空》。</p><p>滚动或触摸阅读时，逐句播放会暂停。</p></dialog>
  <dialog id="contents-dialog" aria-labelledby="contents-title"><div class="dialog-top"><h2 id="contents-title">这封信的星图</h2><button data-dismiss aria-label="关闭目录">×</button></div><nav id="chapter-links" aria-label="章节目录"></nav></dialog>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  <audio id="soundtrack" preload="none" loop src="same-sky.mp3"></audio>
</body>
</html>
